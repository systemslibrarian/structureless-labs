name: Link check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift check — external links can rot independently of code changes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lychee — check every markdown file in the repo
        uses: lycheeverse/lychee-action@v2
        with:
          # lychee v0.23+ excludes mailto: links by default; --include-mail to opt in.
          args: >-
            --no-progress
            --max-concurrency 4
            --accept '200..=299, 403, 429'
            './**/*.md'
          fail: true
